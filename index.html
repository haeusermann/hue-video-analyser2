<!DOCTYPE html>
<html lang="de">
<head>
    <!-- ================================================================= -->
    <!-- META TAGS AND DOCUMENT CONFIGURATION                              -->
    <!-- ================================================================= -->
    <meta charset="UTF-8">
    <!-- Viewport settings for mobile optimization:
         - width=device-width: Match viewport to device width
         - initial-scale=1.0: No initial zoom
         - maximum-scale=1.0: Prevent user zoom (important for video apps)
         - user-scalable=no: Disable pinch zoom on viewport
         - viewport-fit=cover: Extend content into safe areas (notch, etc.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- ================================================================= -->
    <!-- APPLE PWA (Progressive Web App) CONFIGURATION                     -->
    <!-- These meta tags enable iOS home screen app functionality          -->
    <!-- ================================================================= -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Status bar style: black-translucent allows content under status bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MotionAnalyzer">
    
    <!-- Touch icon for iOS home screen -->
    <link rel="apple-touch-icon" href="Logo.png">
    <!-- Web App Manifest for PWA installation -->
    <link rel="manifest" href="manifest.json">

    <!-- ================================================================= -->
    <!-- ANDROID/CHROME PWA CONFIGURATION                                  -->
    <!-- ================================================================= -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Theme color affects browser UI and status bar color -->
    <meta name="theme-color" content="#000000">

    <title>Video Analyser</title>

    <!-- ============================================================ -->
    <!-- GOATCOUNTER ANALYTICS (cookieless, works on all deployments) -->
    <!-- Tracks page views for GitHub Pages AND Vercel in one place.  -->
    <!-- ============================================================ -->
    <script>
        // Config must be defined BEFORE count.js loads.
        // Prefix every tracked path with the hostname so that hits from
        // haeusermann.github.io and hue-video-analyzer.vercel.app can be
        // told apart in the same GoatCounter dashboard.
        window.goatcounter = {
            path: function (p) {
                return location.host + p;
            }
        };
    </script>
    <!-- Loads the GoatCounter tracking script asynchronously (no render blocking) -->
    <script data-goatcounter="https://huesiski.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    <!-- ================================================================= -->
    <!-- CUSTOM STYLES                                                     -->
    <!-- ================================================================= -->
    <style>
        /* ============================================================= */
        /* CSS CUSTOM PROPERTIES (Variables)                             */
        /* ============================================================= */
        :root {
            /* Safe area inset for devices with notches/home indicators */
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        /* ============================================================= */
        /* BODY STYLES - Base layout and mobile optimization             */
        /* ============================================================= */
        body {
            /* Prevent pull-to-refresh and overscroll effects */
            overscroll-behavior-y: contain;
            /* Disable default touch actions for custom gesture handling */
            touch-action: none;
            /* Dark background for video app aesthetic */
            background-color: #000;
            /* Prevent text selection for better touch UX */
            user-select: none;
            -webkit-user-select: none;
            /* Dynamic viewport height - accounts for mobile browser chrome */
            height: 100dvh; 
            /* Flexbox layout for vertical stacking */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* System font stack for optimal rendering */
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        /* ============================================================= */
        /* SPLASH SCREEN - Loading screen with logo                      */
        /* ============================================================= */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* High z-index to cover all content during load */
            z-index: 9999;
            /* Smooth fade-out transition */
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        /* Splash screen logo sizing */
        #splash-screen img {
            max-width: 250px;
            width: 60%;
            height: auto;
            object-fit: contain;
        }

        /* Hidden state for splash screen fade-out */
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        /* ============================================================= */
        /* WORKBENCH - Main video grid container                         */
        /* ============================================================= */
        #workbench {
            display: grid;
            /* Small gap between video players in dual mode */
            gap: 2px;
            /* Fill remaining vertical space */
            flex: 1;
            /* Allow content to shrink */
            min-height: 0;
            /* Dark background visible in gaps */
            background-color: #111;
        }

        /* Single video mode - full width single column */
        .mode-single { 
            grid-template-columns: 1fr; 
        }
        
        /* Dual video mode - stacked vertically by default (portrait) */
        .mode-dual { 
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }
        
        /* Landscape orientation: side-by-side layout for dual mode */
        @media (min-aspect-ratio: 1/1) {
            .mode-dual { 
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr;
            }
        }

        /* ============================================================= */
        /* VIDEO CONTAINER - Wrapper for each video player               */
        /* ============================================================= */
        .video-container {
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* Zoom wrapper - enables pinch-to-zoom and pan functionality */
        .zoom-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Optimize for transform animations */
            will-change: transform;
        }

        /* Video element styling */
        video {
            max-width: 100%;
            max-height: 100%;
            /* Maintain aspect ratio while fitting container */
            object-fit: contain;
            /* Disable pointer events - handled by overlay */
            pointer-events: none;
        }

        /* ============================================================= */
        /* JOG WHEEL VISUALIZATION - Timeline scrubbing indicator        */
        /* ============================================================= */
        .jog-ticks {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            /* Non-interactive - visual feedback only */
            pointer-events: none;
            z-index: 15;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            opacity: 0.6;
            /* Fade edges for smooth visual appearance */
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        /* Container for tick marks */
        .tick-container {
            display: flex;
            gap: 12px;
            height: 100%;
            align-items: flex-end;
            transform: translateX(0px);
            /* Optimize for transform animations */
            will-change: transform;
        }

        /* Individual tick mark styling */
        .tick { 
            width: 1px; 
            height: 12px; 
            background: rgba(255,255,255,0.4); 
        }
        
        /* Major tick marks (every 10th) - taller and colored */
        .tick.major { 
            height: 20px; 
            background: #3b82f6; 
            width: 2px; 
        }

        /* Jog overlay - invisible touch/click target for scrubbing */
        .jog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            /* Enable custom touch gesture handling */
            touch-action: none;
        }

        /* ============================================================= */
        /* GLOBAL JOG WHEEL - Overlay for sync-lock mode                 */
        /* Positioned as overlay at bottom of video frames               */
        /* ============================================================= */
        .global-jog-overlay-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 20;
            display: none;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
        }

        /* Show global jog overlay when sync-lock is active */
        .sync-locked .global-jog-overlay-container {
            display: block !important;
        }

        .global-jog-ticks {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 40px;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            opacity: 0.9;
            /* Wide fade gradient for overlay appearance */
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .global-jog-overlay-container .jog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 25;
            touch-action: none;
        }

        /* ============================================================= */
        /* SYNC-LOCK MODE UI ADJUSTMENTS                                 */
        /* Hide individual player controls when videos are synced        */
        /* ============================================================= */
        .sync-locked #controls1,
        .sync-locked #controls2 {
            display: none !important;
        }

        /* Hide individual jog wheels when using global sync jog */
        .sync-locked #jogTicks1,
        .sync-locked #jogTicks2 {
            display: none !important;
        }

        /* ============================================================= */
        /* UI OVERLAY - Container for control buttons                    */
        /* ============================================================= */
        .ui-overlay {
            position: absolute;
            z-index: 30;
            pointer-events: auto;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 10px;
        }

        /* Positioning classes for UI overlays */
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .top-center { top: 0; left: 50%; transform: translateX(-50%); }
        .bottom-right { bottom: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-center { bottom: 0; left: 50%; transform: translateX(-50%); }

        /* ============================================================= */
        /* GLASS BUTTON - Frosted glass effect button style              */
        /* ============================================================= */
        .glass-btn {
            /* Semi-transparent dark background */
            background: rgba(15, 23, 42, 0.8);
            /* Frosted glass blur effect */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        /* Active/pressed state for glass buttons */
        .glass-btn:active { 
            transform: scale(0.95); 
            background: rgba(30, 41, 59, 0.9); 
        }
        
        /* Toggle active state - blue highlight */
        .glass-btn.active { 
            background: #3b82f6; 
            color: white; 
            border-color: #60a5fa; 
        }
        
        /* Disabled state - faded and non-interactive */
        .glass-btn.disabled { 
            opacity: 0.3; 
            pointer-events: none; 
        }

        /* ============================================================= */
        /* FRAME STEP BUTTONS - Compact buttons for frame navigation     */
        /* ============================================================= */
        .frame-step-btn {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* Prevent text selection during hold */
            user-select: none;
            -webkit-user-select: none;
            /* Highlight color when held */
            -webkit-tap-highlight-color: rgba(59, 130, 246, 0.3);
        }

        /* Pressed state for frame step buttons */
        .frame-step-btn:active { 
            transform: scale(0.92); 
            background: rgba(59, 130, 246, 0.6); 
            border-color: #60a5fa;
        }

        /* Playing state when button is held */
        .frame-step-btn.playing {
            background: rgba(59, 130, 246, 0.7);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        /* ============================================================= */
        /* TIME BADGE - Current time display                             */
        /* ============================================================= */
        .time-badge-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            /* Rounded bottom corners - attaches to top edge */
            border-radius: 0 0 12px 12px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-top: none;
        }

        /* Time display text styling */
        .time-badge {
            font-family: ui-monospace, monospace;
            font-size: 16px;
            font-weight: 700;
            color: #60a5fa;
        }

        /* Timer reset button */
        .reset-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        /* ============================================================= */
        /* GLASS SELECT - Styled dropdown for speed selection            */
        /* ============================================================= */
        select.glass-select {
            background: rgba(15, 23, 42, 0.8);
            color: #60a5fa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            outline: none;
            /* Remove default dropdown arrow */
            appearance: none;
            cursor: pointer;
        }

        /* Hidden file input - triggered by visible button */
        .hidden-file-input {
            display: none;
        }

        /* ============================================================= */
        /* SYNC PANEL - Control bar for dual video mode                  */
        /* ============================================================= */
        #syncPanel {
            background-color: #000;
            border-top: 1px solid #1e293b;
            padding: 0.75rem;
            /* Prevent shrinking */
            flex-shrink: 0;
            /* Account for home indicator on modern phones */
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }

        /* Sync panel content layout */
        #syncPanel > div {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: 80rem;
            margin: 0 auto;
        }

        /* Sync play button - larger and highlighted */
        .sync-play-btn {
            background: rgba(37, 99, 235, 0.8);
            height: 40px;
            width: 48px;
        }

        /* Utility height class */
        .h-10 {
            height: 40px;
        }

        /* Utility padding class */
        .px-3 {
            padding-left: 12px;
            padding-right: 12px;
        }

        /* Speed selector container in sync panel */
        .speed-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 0 4px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ============================================================= */
        /* SYNC FRAME CONTROLS - Frame step buttons in sync panel        */
        /* ============================================================= */
        .sync-frame-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            margin: 0 8px;
        }

        /* ============================================================= */
        /* RESPONSIVE ADJUSTMENTS                                        */
        /* ============================================================= */
        @media (min-width: 641px) {
            /* Larger buttons on tablet/desktop */
            .frame-step-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================= -->
    <!-- SPLASH SCREEN                                                     -->
    <!-- Displays logo during initial app load, fades out after 2 seconds  -->
    <!-- ================================================================= -->
    <div id="splash-screen">
        <img src="Logo.png" alt="Häusermann's Video Analyser" onerror="this.style.display='none'; document.getElementById('splash-text').style.display='block';">
        <h1 id="splash-text" style="display: none; color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em;">Video Analyser</h1>
    </div>

    <!-- ================================================================= -->
    <!-- MAIN WORKBENCH - Video player grid                                -->
    <!-- Contains one or two video players depending on mode               -->
    <!-- ================================================================= -->
    <main id="workbench" class="mode-single">
        
        <!-- ============================================================= -->
        <!-- PLAYER 1 - Primary video player                               -->
        <!-- Always visible in both single and dual modes                  -->
        <!-- ============================================================= -->
        <div id="player1" class="video-container">
            
            <!-- Top Left Controls: Mode toggle and fullscreen -->
            <div class="ui-overlay top-left" style="flex-direction: column;">
                <!-- Toggle between single and dual video mode -->
                <button onclick="toggleCompareMode()" id="compareBtn" class="glass-btn shadow-xl min-w-[70px]">
                    <span id="compareBtnText">DUAL</span>
                </button>
                <!-- Fullscreen toggle button with dynamic icon -->
                <button onclick="toggleFullscreen()" id="fullscreenBtn" class="glass-btn shadow-lg" title="Toggle fullscreen">
                    <!-- Expand icon (shown when not fullscreen) -->
                    <svg id="fullscreenIconExpand" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4 4h5M4 4v5M4 4l5 5M20 4h-5M20 4v5M20 4l-5 5M4 20h5M4 20v-5M4 20l5-5M20 20h-5M20 20v-5M20 20l-5-5"/>
                    </svg>
                    <!-- Compress icon (shown when in fullscreen) -->
                    <svg id="fullscreenIconCompress" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display: none;">
                        <path d="M9 9H4M9 9V4M9 9L4 4M15 9h5M15 9V4M15 9l5-5M9 15H4M9 15v5M9 15l-5 5M15 15h5M15 15v5M15 15l5 5"/>
                    </svg>
                </button>
            </div>

            <!-- Top Center: Time display with reset button -->
            <div class="ui-overlay top-center">
                <div class="time-badge-container">
                    <div class="time-badge" id="time1">00:00.00</div>
                    <button onclick="resetTimer(1)" class="reset-btn" title="Reset timer">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m0 0H15"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Top Right: Video file selector -->
            <div class="ui-overlay top-right">
                <button onclick="document.getElementById('fileInput1').click()" class="glass-btn shadow-lg">
                    VIDEO
                </button>
                <input type="file" accept="video/*" id="fileInput1" class="hidden-file-input" onchange="loadVideo(event, 'main')">
            </div>

            <!-- Bottom Right: Playback controls with frame stepping -->
            <div class="ui-overlay bottom-right" id="controls1">
                <!-- Jump to start of video - line with left arrow icon -->
                <button onclick="goToStartSingle(1)" id="goStartBtn1" class="glass-btn" title="Go to start">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M6 6v12"/>
                        <path d="M20 12H10M15 17l-5-5 5-5"/>
                    </svg>
                </button>
                <!-- Step backward one frame (hold for slow reverse playback) - left arrow -->
                <button id="frameBackBtn1" class="frame-step-btn" title="Step backward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <!-- Step forward one frame (hold for slow forward playback) - right arrow -->
                <button id="frameForwardBtn1" class="frame-step-btn" title="Step forward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
                <!-- Playback speed selector -->
                <select onchange="setSpeed('v1', this.value)" id="speed1" class="glass-select">
                    <option value="0.125">0.12x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.50x</option>
                    <option value="1.0" selected>1.00x</option>
                </select>
                <!-- Play/Pause toggle button -->
                <button onclick="togglePlay('v1')" id="playBtn1" class="glass-btn bg-blue-600/80 w-12 h-12 rounded-full">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>

            <!-- Video zoom wrapper - enables pinch-to-zoom functionality -->
            <div id="zoom1" class="zoom-wrapper">
                <video id="v1" playsinline preload="auto" muted></video>
            </div>
            
            <!-- Jog wheel tick marks visualization -->
            <div class="jog-ticks" id="jogTicks1">
                <div id="ticks1" class="tick-container"></div>
            </div>
            
            <!-- Invisible overlay for touch/mouse jog wheel interaction -->
            <div class="jog-overlay" id="jog1"></div>

            <!-- Global jog wheel overlay for sync-lock mode (Player 1) -->
            <div class="global-jog-overlay-container" id="globalJogOverlay1">
                <div class="global-jog-ticks">
                    <div id="ticksGlobal1" class="tick-container"></div>
                </div>
                <div class="jog-overlay" id="jogGlobal1"></div>
            </div>
        </div>

        <!-- ============================================================= -->
        <!-- PLAYER 2 - Secondary video player (dual mode only)            -->
        <!-- Hidden by default, shown when dual mode is activated          -->
        <!-- ============================================================= -->
        <div id="player2" class="video-container" style="display: none;">
            
            <!-- Top Center: Time display with reset button -->
            <div class="ui-overlay top-center">
                <div class="time-badge-container">
                    <div class="time-badge" id="time2">00:00.00</div>
                    <button onclick="resetTimer(2)" class="reset-btn" title="Reset timer">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m0 0H15"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Top Right: Video file selector -->
            <div class="ui-overlay top-right">
                <button onclick="document.getElementById('fileInput2').click()" class="glass-btn shadow-lg">
                    VIDEO
                </button>
                <input type="file" accept="video/*" id="fileInput2" class="hidden-file-input" onchange="loadVideo(event, 'compare')">
            </div>

            <!-- Bottom Right: Playback controls with frame stepping -->
            <div class="ui-overlay bottom-right" id="controls2">
                <!-- Jump to start of video - line with left arrow icon -->
                <button onclick="goToStartSingle(2)" id="goStartBtn2" class="glass-btn" title="Go to start">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M6 6v12"/>
                        <path d="M20 12H10M15 17l-5-5 5-5"/>
                    </svg>
                </button>
                <!-- Step backward one frame - left arrow -->
                <button id="frameBackBtn2" class="frame-step-btn" title="Step backward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <!-- Step forward one frame - right arrow -->
                <button id="frameForwardBtn2" class="frame-step-btn" title="Step forward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
                <!-- Playback speed selector -->
                <select onchange="setSpeed('v2', this.value)" id="speed2" class="glass-select">
                    <option value="0.125">0.12x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.50x</option>
                    <option value="1.0" selected>1.00x</option>
                </select>
                <!-- Play/Pause toggle button -->
                <button onclick="togglePlay('v2')" id="playBtn2" class="glass-btn w-12 h-10 rounded-full">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>

            <!-- Video zoom wrapper -->
            <div id="zoom2" class="zoom-wrapper">
                <video id="v2" playsinline preload="auto" muted></video>
            </div>

            <!-- Jog wheel tick marks visualization -->
            <div class="jog-ticks" id="jogTicks2">
                <div id="ticks2" class="tick-container"></div>
            </div>

            <!-- Invisible overlay for touch/mouse jog wheel interaction -->
            <div class="jog-overlay" id="jog2"></div>

            <!-- Global jog wheel overlay for sync-lock mode (Player 2) -->
            <div class="global-jog-overlay-container" id="globalJogOverlay2">
                <div class="global-jog-ticks">
                    <div id="ticksGlobal2" class="tick-container"></div>
                </div>
                <div class="jog-overlay" id="jogGlobal2"></div>
            </div>
        </div>
    </main>

    <!-- ================================================================= -->
    <!-- SYNC PANEL - Control bar for dual video mode                      -->
    <!-- Contains synchronized playback controls                           -->
    <!-- ================================================================= -->
    <div id="syncPanel" style="display: none;">
        <div>
            <!-- Jump to start button (synced) - line with left arrow icon -->
            <button onclick="goToStart()" id="btnGoToStart" class="glass-btn h-10 px-3" title="Go to start">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M6 6v12"/>
                    <path d="M20 12H10M15 17l-5-5 5-5"/>
                </svg>
            </button>

            <!-- Synced frame step controls (for dual mode) -->
            <div class="sync-frame-controls">
                <!-- Step both videos backward one frame - left arrow -->
                <button id="syncFrameBackBtn" class="frame-step-btn" title="Step backward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <!-- Step both videos forward one frame - right arrow -->
                <button id="syncFrameForwardBtn" class="frame-step-btn" title="Step forward (hold for slow play)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            
            <!-- Sync play/pause button -->
            <button onclick="toggleSyncPlay()" id="syncPlayBtn" class="glass-btn sync-play-btn">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <!-- Global speed selector -->
            <div class="speed-container">
                <select onchange="setGlobalSpeed(this.value)" id="globalSpeed" class="glass-select">
                    <option value="0.125">0.12x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.50x</option>
                    <option value="1.0" selected>1.00x</option>
                </select>
            </div>
            
            <!-- Sync lock toggle button -->
            <button onclick="toggleLock()" id="lockBtn" class="glass-btn h-10 px-3">
                <svg id="lockIconOpen" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
            </button>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- JAVASCRIPT - Application Logic                                    -->
    <!-- ================================================================= -->
    <script>
        // =================================================================
        // GOATCOUNTER EVENT TRACKING
        // Tracks app launches (PWA) as events in GoatCounter
        // =================================================================
        
        window.addEventListener('load', () => {
            // Detect if app is running as installed PWA
            const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                         window.navigator.standalone === true;
            
            // Track PWA launches separately from browser visits
            if (isPWA) {
                console.log("App launched as PWA");
                // count.js loads async, so wait until it is available
                let tries = 0;
                const sendPwaEvent = () => {
                    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
                        window.goatcounter.count({
                            path: 'pwa_open',
                            title: 'PWA opened',
                            event: true
                        });
                    } else if (tries++ < 20) {
                        setTimeout(sendPwaEvent, 500);
                    }
                };
                sendPwaEvent();
            }

            // Hide splash screen after 2 second delay
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('hidden');
                    // Remove from DOM after fade animation completes
                    setTimeout(() => splash.remove(), 600);
                }
            }, 2000);

            // Set initial fullscreen icon state
            updateFullscreenIcon();
        });

        // =================================================================
        // FULLSCREEN FUNCTIONALITY
        // Handles entering and exiting fullscreen mode
        // =================================================================
        
        /**
         * Toggle fullscreen mode on/off
         * Uses standard Fullscreen API with webkit fallback for Safari
         */
        function toggleFullscreen() {
            // Check if currently in fullscreen
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Enter fullscreen - try standard API first, then webkit
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        /**
         * Update fullscreen button icon based on current state
         * Shows expand icon when not fullscreen, compress icon when fullscreen
         */
        function updateFullscreenIcon() {
            const expandIcon = document.getElementById('fullscreenIconExpand');
            const compressIcon = document.getElementById('fullscreenIconCompress');
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (expandIcon && compressIcon) {
                expandIcon.style.display = isFullscreen ? 'none' : 'block';
                compressIcon.style.display = isFullscreen ? 'block' : 'none';
            }
        }

        // Listen for fullscreen changes (user may exit via Escape key)
        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        // =================================================================
        // GLOBAL VARIABLES AND STATE
        // =================================================================
        
        // Video element references
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');
        const workbench = document.getElementById('workbench');
        
        // Application state
        let compareMode = false;  // True when dual video mode is active
        let isLocked = false;     // True when videos are sync-locked
        let offset1 = 0;          // Timer offset for Player 1 (for relative timing)
        let offset2 = 0;          // Timer offset for Player 2
        let syncDiff = 0;         // Time difference between videos when sync-locked
        let syncLockStartTime1 = 0;  // Video 1 position when sync lock was activated
        let syncLockStartTime2 = 0;  // Video 2 position when sync lock was activated
        
        // Flywheel (momentum) behaviour after releasing the jog wheel
        // Max coast distance ~ MAX_VELOCITY * 16.7 / (1 - FRICTION) px (1 px = 10 ms video)
        const FLYWHEEL_FRICTION = 0.88;     // Velocity kept per 16.7 ms (lower = stops sooner)
        const FLYWHEEL_MIN_START = 0.2;     // px/ms - slower releases don't coast
        const FLYWHEEL_MIN_STOP = 0.03;     // px/ms - coasting ends below this
        const FLYWHEEL_MAX_VELOCITY = 2;    // px/ms - cap for very fast flicks
        const FLYWHEEL_STALE_MS = 80;       // Finger held still this long = no coasting

        // All flywheels, so any touch or Play can stop coasting everywhere
        const allFlywheels = [];
        function stopAllFlywheels() {
            allFlywheels.forEach(fw => fw.stop());
        }
        // Any new touch, click or key press stops coasting (and frame rate measuring)
        const onUserInput = () => {
            stopAllFlywheels();
            cancelFrameProbes();
        };
        document.addEventListener('touchstart', onUserInput, { capture: true, passive: true });
        document.addEventListener('mousedown', onUserInput, { capture: true });
        document.addEventListener('keydown', onUserInput, { capture: true });

        /**
         * Creates a time-based flywheel for a jog wheel.
         * Feed it finger movement with track(); call release() when the finger
         * lifts and it keeps calling applyDelta(px) with decaying speed,
         * using the same px units as the live drag.
         * @param {function(number):void} applyDelta - Scrubs the video by a pixel delta
         */
        function createFlywheel(applyDelta) {
            let velocity = 0;   // px/ms
            let lastMoveTime = 0;
            let rafId = null;

            const stop = () => {
                if (rafId !== null) cancelAnimationFrame(rafId);
                rafId = null;
            };

            const fw = {
                stop,
                // Call at the start of a new touch/drag
                reset() {
                    stop();
                    velocity = 0;
                    lastMoveTime = 0;
                },
                // Call on every drag movement with the pixel delta
                track(deltaX) {
                    const now = performance.now();
                    if (lastMoveTime) {
                        const dt = Math.max(now - lastMoveTime, 1);
                        const instant = deltaX / dt;
                        velocity = 0.8 * instant + 0.2 * velocity; // smoothed
                    }
                    lastMoveTime = now;
                },
                // Call when the finger/mouse is released
                release() {
                    stop();
                    const idle = performance.now() - lastMoveTime;
                    if (!lastMoveTime || idle > FLYWHEEL_STALE_MS ||
                        Math.abs(velocity) < FLYWHEEL_MIN_START) return;

                    velocity = Math.max(-FLYWHEEL_MAX_VELOCITY, Math.min(velocity, FLYWHEEL_MAX_VELOCITY));
                    let prev = performance.now();
                    const step = (now) => {
                        const dt = Math.min(now - prev, 50);
                        prev = now;
                        applyDelta(velocity * dt);
                        velocity *= Math.pow(FLYWHEEL_FRICTION, dt / 16.67);
                        rafId = Math.abs(velocity) > FLYWHEEL_MIN_STOP ? requestAnimationFrame(step) : null;
                    };
                    rafId = requestAnimationFrame(step);
                }
            };
            allFlywheels.push(fw);
            return fw;
        }

        // Slow playback speed when holding frame step buttons (0.25x)
        const HOLD_PLAY_SPEED = 0.25;

        // =================================================================
        // FRAME RATE DETECTION
        // Measures the real frame rate of each video so frame steps hit
        // exactly one frame (25, 30, 60, 120, 240 fps ...)
        // =================================================================

        const DEFAULT_FRAME_DURATION = 1 / 30;   // Fallback until measured
        const COMMON_FPS = [24, 25, 30, 48, 50, 60, 90, 100, 120, 240];

        /**
         * Duration of one frame in seconds for the given video
         * @param {HTMLVideoElement} video
         */
        function frameDur(video) {
            return video._frameDur || DEFAULT_FRAME_DURATION;
        }

        /**
         * Speed selected by the user for this video
         * @param {HTMLVideoElement} video
         */
        function selectedSpeed(video) {
            return parseFloat(document.getElementById(video === v1 ? 'speed1' : 'speed2').value);
        }

        /**
         * Briefly plays the video muted at 0.25x after loading and measures
         * the time between consecutive frames, then returns to the start.
         * Cancelled as soon as the user interacts (see cancelFrameProbes).
         * @param {HTMLVideoElement} video
         */
        function probeFrameRate(video) {
            if (!('requestVideoFrameCallback' in video)) return;

            const token = {};
            video._probe = token;
            const deltas = [];
            let last = null;

            const finish = () => {
                if (video._probe !== token) return;
                video._probe = null;
                video.pause();
                video.playbackRate = selectedSpeed(video);
                video.currentTime = 0;
                if (deltas.length) {
                    const fps = 1 / Math.min(...deltas);
                    // Snap to a common frame rate when close (within 4 %)
                    const snap = COMMON_FPS.find(f => Math.abs(f - fps) / f < 0.04);
                    video._frameDur = 1 / (snap || fps);
                }
            };

            const onFrame = (now, meta) => {
                if (video._probe !== token) return;
                if (last && meta.presentedFrames - last.n === 1) {
                    const d = meta.mediaTime - last.t;
                    if (d > 0.002) deltas.push(d);
                }
                last = { t: meta.mediaTime, n: meta.presentedFrames };
                if (deltas.length >= 6) finish();
                else video.requestVideoFrameCallback(onFrame);
            };

            video.playbackRate = 0.25;
            video.requestVideoFrameCallback(onFrame);
            video.play().catch(() => {
                if (video._probe === token) {
                    video._probe = null;
                    video.playbackRate = selectedSpeed(video);
                }
            });
            setTimeout(finish, 2000);
        }

        /**
         * Stop running frame rate measurements (user takes over)
         */
        function cancelFrameProbes() {
            [v1, v2].forEach(video => {
                if (!video._probe) return;
                video._probe = null;
                video.pause();
                video.playbackRate = selectedSpeed(video);
            });
        }

        // =================================================================
        // SYNC-LOCKED SEEKING
        // Keeps v2 exactly syncDiff ahead of v1, also at the video edges
        // =================================================================

        /**
         * Seek both videos while sync-locked. The target is clamped so that
         * neither video runs past its start or end (prevents losing sync).
         * @param {number} t1 - Target time for v1
         */
        function seekSynced(t1) {
            const d1 = v1.duration || Infinity;
            const d2 = v2.duration || Infinity;
            const lo = Math.max(0, -syncDiff);
            const hi = Math.min(d1, d2 - syncDiff);
            const t = hi >= lo ? Math.min(Math.max(t1, lo), hi) : Math.max(0, t1);
            seekInstant(v1, t);
            seekInstant(v2, t + syncDiff);
        }

        // =================================================================
        // VIDEO EVENT HANDLERS
        // =================================================================

        [v1, v2].forEach(video => {
            video.addEventListener('loadedmetadata', () => {
                // Set initial playback rate from speed selector
                video.playbackRate = selectedSpeed(video);
            });
            // Measure frame rate once the first frame is available
            video.addEventListener('loadeddata', () => probeFrameRate(video));
            // Playing stops any flywheel coasting
            video.addEventListener('play', () => {
                if (!video._probe) stopAllFlywheels();
            });
            // Keep play/pause icons in sync with the real state
            ['play', 'pause', 'ended'].forEach(ev => video.addEventListener(ev, updatePlayIcons));
        });

        // =================================================================
        // KEYBOARD CONTROLS (Desktop)
        // Arrow keys for frame stepping, Space for play/pause
        // =================================================================
        
        document.addEventListener('keydown', (e) => {
            // Don't hijack keys while a dropdown or input has focus
            if (e.target.closest && e.target.closest('select, input, textarea')) return;

            switch(e.code) {
                case 'Space':
                    // Prevent page scroll
                    e.preventDefault();

                    // Handle play/pause based on current mode
                    if (compareMode) {
                        // Dual mode: toggle both videos together
                        toggleSyncPlay();
                    } else {
                        // Single mode: toggle Player 1 only
                        togglePlay('v1');
                    }
                    break;

                case 'ArrowRight':
                    e.preventDefault();
                    if (compareMode) stepBoth(1); else stepVideo(v1, 1);
                    break;

                case 'ArrowLeft':
                    e.preventDefault();
                    if (compareMode) stepBoth(-1); else stepVideo(v1, -1);
                    break;
            }
        });

        // =================================================================
        // FRAME STEPPING
        // Moves exactly one frame, using the measured frame rate
        // =================================================================

        /**
         * Time of the frame 'dir' frames away from time t (aims at the
         * frame centre so rounding never lands on the same frame again)
         */
        function frameStepTime(video, t, dir) {
            const d = frameDur(video);
            const index = Math.floor(t / d + 1e-3);
            return Math.max(0, (index + dir + 0.5) * d);
        }

        /**
         * Step a single video by one frame (dir = 1 forward, -1 backward)
         */
        function stepVideo(video, dir) {
            video.pause();
            seekInstant(video, frameStepTime(video, video.currentTime, dir));
        }

        /**
         * Step both videos by one frame, keeping the sync offset when locked
         */
        function stepBoth(dir) {
            v1.pause();
            v2.pause();
            if (isLocked) {
                seekSynced(frameStepTime(v1, v1.currentTime, dir));
            } else {
                seekInstant(v1, frameStepTime(v1, v1.currentTime, dir));
                seekInstant(v2, frameStepTime(v2, v2.currentTime, dir));
            }
        }

        // =================================================================
        // GO TO START FUNCTIONS
        // Jump to beginning of video(s)
        // =================================================================
        
        /**
         * Jump both videos to start position
         * When sync-locked: returns to the frame positions where sync lock was activated
         * When not locked: goes to beginning (0) of both videos
         */
        function goToStart() {
            v1.pause();
            v2.pause();
            
            if (isLocked) {
                // When sync-locked, return to the positions where sync lock was activated
                seekInstant(v1, syncLockStartTime1);
                seekInstant(v2, syncLockStartTime2);
            } else {
                // Not locked: just go to 0 for both
                seekInstant(v1, 0);
                if (compareMode) {
                    seekInstant(v2, 0);
                }
            }
        }

        /**
         * Jump single player to start position
         * @param {number} playerId - 1 or 2 for which player to reset
         */
        function goToStartSingle(playerId) {
            // Disabled when sync-locked
            if (isLocked) return;
            
            const video = playerId === 1 ? v1 : v2;
            video.pause();
            seekInstant(video, 0);
            
            // Reset timer offset for this player
            if (playerId === 1) {
                offset1 = 0;
            } else {
                offset2 = 0;
            }
        }

        // =================================================================
        // COMPARE MODE TOGGLE
        // Switch between single and dual video display
        // =================================================================
        
        /**
         * Toggle between single and dual video mode
         * Updates UI, shows/hides Player 2 and sync panel
         */
        function toggleCompareMode() {
            compareMode = !compareMode;

            if (compareMode) {
                // Switch to dual mode
                document.getElementById('player2').style.display = 'flex';
                document.getElementById('syncPanel').style.display = 'block';
                document.getElementById('compareBtnText').innerText = 'SINGLE';
                workbench.className = 'mode-dual';
                // Sync playback speeds
                setGlobalSpeed(document.getElementById('globalSpeed').value);
            } else {
                // Switch to single mode
                // Release sync lock (resets button and global jog overlays)
                if (isLocked) toggleLock();
                // Player 2 is hidden now - don't let it play on invisibly
                v2.pause();
                document.getElementById('player2').style.display = 'none';
                document.getElementById('syncPanel').style.display = 'none';
                document.getElementById('compareBtnText').innerText = 'DUAL';
                workbench.className = 'mode-single';
            }
            updatePlayIcons();
        }

        // =================================================================
        // JOG WHEEL TICK GENERATION
        // Creates visual tick marks for jog wheel display
        // =================================================================
        
        /**
         * Generate tick marks for jog wheel visualization
         * @param {string} containerId - ID of container element to populate
         */
        function generateTicks(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            
            // Create 100 ticks, every 10th is a major (larger) tick
            for(let i = 0; i < 100; i++) {
                const tick = document.createElement('div');
                tick.className = i % 10 === 0 ? 'tick major' : 'tick';
                container.appendChild(tick);
            }
        }
        
        // Initialize all jog wheel tick containers
        generateTicks('ticks1');
        generateTicks('ticks2');
        generateTicks('ticksGlobal1');
        generateTicks('ticksGlobal2');

        // =================================================================
        // VIDEO FILE LOADING
        // Handle video file selection and loading
        // =================================================================
        
        /**
         * Load video file into player
         * @param {Event} event - File input change event
         * @param {string} target - 'main' for Player 1, 'compare' for Player 2
         */
        function loadVideo(event, target) {
            const input = event.target;
            const file = input.files[0];
            // Clear the input so choosing the same file again still fires 'change'
            input.value = '';
            if (!file) return;

            const video = target === 'main' ? v1 : v2;

            // A new video invalidates the sync offset - release the lock
            if (isLocked) toggleLock();

            // Stop a running frame rate measurement and forget the old frame rate
            cancelFrameProbes();
            video._frameDur = null;

            // Free the previous blob URL (otherwise the old video stays in memory)
            if (video.src && video.src.startsWith('blob:')) {
                URL.revokeObjectURL(video.src);
            }

            // Create blob URL for local file
            video.src = URL.createObjectURL(file);

            // Reset speed selector to default
            document.getElementById(target === 'main' ? 'speed1' : 'speed2').value = "1.0";
            video.playbackRate = 1.0;
            video.load();

            // Reset timer offset
            if (target === 'main') offset1 = 0; else offset2 = 0;
        }

        // =================================================================
        // TIMER FUNCTIONS
        // Reset and format time display
        // =================================================================
        
        /**
         * Reset timer for specified player
         * Sets current position as new zero point
         * @param {number} id - Player ID (1 or 2)
         */
        function resetTimer(id) {
            if (id === 1) {
                offset1 = v1.currentTime;
                document.getElementById('time1').innerText = '00:00.00';
            } else {
                offset2 = v2.currentTime;
                document.getElementById('time2').innerText = '00:00.00';
            }
        }

        /**
         * Format seconds as MM:SS.CC (minutes:seconds.centiseconds)
         * @param {number} seconds - Time in seconds
         * @param {number} offset - Offset to subtract (for relative timing)
         * @returns {string} Formatted time string
         */
        function formatTime(seconds, offset = 0) {
            const diff = Math.max(0, seconds - offset);
            const m = Math.floor(diff / 60);
            const s = Math.floor(diff % 60);
            const ms = Math.floor((diff % 1) * 100);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }

        // =================================================================
        // VIDEO SEEKING
        // Precise frame-accurate seeking
        // =================================================================
        
        /**
         * Seek video to specific time instantly
         * Clamps time to valid range and skips tiny movements
         * @param {HTMLVideoElement} video - Video element to seek
         * @param {number} time - Target time in seconds
         */
        function seekInstant(video, time) {
            // Seeking needs at least the metadata (duration) to be loaded
            if (video.readyState < 1) return;
            
            // Clamp to valid range
            const target = Math.max(0, Math.min(time, video.duration || Infinity));
            
            // Skip if change is negligible (prevents jitter)
            if (Math.abs(video.currentTime - target) < 0.001) return;
            
            video.currentTime = target;
        }

        // =================================================================
        // UI UPDATE FUNCTION
        // Synchronize UI elements with video state
        // =================================================================
        
        // SVG icons for play and pause states
        const PLAY_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const PAUSE_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        /**
         * Set a button's icon, but only touch the DOM when it actually
         * changes (replacing it under a finger can swallow the tap)
         */
        function setIcon(btnId, playing) {
            const btn = document.getElementById(btnId);
            const state = playing ? 'pause' : 'play';
            if (btn.dataset.icon === state) return;
            btn.dataset.icon = state;
            btn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
        }

        /**
         * Update play/pause icons - called directly on play/pause events,
         * so it also works while the video is paused
         */
        function updatePlayIcons() {
            setIcon('playBtn1', !v1.paused);
            setIcon('playBtn2', !v2.paused);
            setIcon('syncPlayBtn', !v1.paused || !v2.paused);
        }

        /**
         * Update the time displays
         */
        function updateTimes() {
            document.getElementById('time1').innerText = formatTime(v1.currentTime, offset1);
            document.getElementById('time2').innerText = formatTime(v2.currentTime, offset2);
        }

        /**
         * Update the time displays in step with the shown video frame
         * Called on every time update for smooth feedback
         */
        function updateUI() {
            // Use requestVideoFrameCallback for precise timing if available
            if ('requestVideoFrameCallback' in v1) {
                v1.requestVideoFrameCallback(updateTimes);
                if (compareMode) v2.requestVideoFrameCallback(updateTimes);
            } else {
                // Fallback to requestAnimationFrame
                requestAnimationFrame(updateTimes);
            }
        }

        // Trigger UI update on video time changes
        v1.ontimeupdate = updateUI;
        v2.ontimeupdate = updateUI;
        // After a seek the time is final - show it even if no new frame is drawn
        v1.addEventListener('seeked', updateTimes);
        v2.addEventListener('seeked', updateTimes);

        // =================================================================
        // SYNC LOCK FUNCTIONALITY
        // Lock videos together with fixed time offset
        // =================================================================
        
        /**
         * Toggle sync lock between videos
         * When locked, videos maintain their relative time offset
         * Also stores the current positions as "start" positions for go-to-start
         */
        function toggleLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lockBtn');

            if (isLocked) {
                // Store current positions as sync lock start positions
                // These will be used when go-to-start is pressed while locked
                syncLockStartTime1 = v1.currentTime;
                syncLockStartTime2 = v2.currentTime;
                
                // Calculate and store time difference between videos
                syncDiff = v2.currentTime - v1.currentTime;
                btn.classList.add('active');
                
                // Sync play state
                if (v1.paused) v2.pause(); 
                else v2.play();
                
                // Apply global speed to both videos
                setGlobalSpeed(document.getElementById('globalSpeed').value);
                
                // Activate sync-lock UI mode (shows global jog overlay)
                document.body.classList.add('sync-locked');
            } else {
                btn.classList.remove('active');
                
                // Deactivate sync-lock UI mode
                document.body.classList.remove('sync-locked');
            }
            updatePlayIcons();
        }

        // =================================================================
        // PLAYBACK SPEED CONTROLS
        // =================================================================
        
        /**
         * Set playback speed for both videos (global control)
         * @param {string} val - Speed value as string (e.g., "0.5")
         */
        function setGlobalSpeed(val) {
            const rate = parseFloat(val);
            v1.playbackRate = rate;
            v2.playbackRate = rate;
            
            // Update all speed selectors to match
            document.getElementById('speed1').value = val;
            document.getElementById('speed2').value = val;
            document.getElementById('globalSpeed').value = val;
        }

        /**
         * Set playback speed for individual video
         * @param {string} id - Video element ID ('v1' or 'v2')
         * @param {string} val - Speed value as string
         */
        function setSpeed(id, val) { 
            const v = document.getElementById(id);
            if (v) v.playbackRate = parseFloat(val);
            
            // Update global speed selector when not locked
            if (compareMode && !isLocked) {
                document.getElementById('globalSpeed').value = val;
            }
        }

        // =================================================================
        // PLAY/PAUSE CONTROLS
        // =================================================================
        
        /**
         * Toggle play/pause for single video
         * @param {string} id - Video element ID
         */
        function togglePlay(id) {
            // Disabled when sync-locked
            if (isLocked) return;
            
            const v = document.getElementById(id);
            v.paused ? v.play() : v.pause();
        }

        /**
         * Toggle play/pause for both videos simultaneously
         */
        function toggleSyncPlay() {
            const isPlaying = !v1.paused || !v2.paused;
            if (isPlaying) { 
                v1.pause(); 
                v2.pause(); 
            } else {
                // Re-align both videos before starting when sync-locked
                if (isLocked) seekSynced(v1.currentTime);
                v1.play();
                v2.play();
            }
        }

        // =================================================================
        // FRAME STEP BUTTON FUNCTIONALITY
        // Single frame stepping and hold-to-play at slow speed
        // =================================================================
        
        /**
         * Setup frame step buttons for a video player
         * Handles both click (single frame) and hold (slow playback)
         * @param {string} backBtnId - ID of backward step button
         * @param {string} forwardBtnId - ID of forward step button
         * @param {HTMLVideoElement} video - Video element to control
         * @param {number} playerId - Player ID for analytics
         */
        function setupFrameStepButtons(backBtnId, forwardBtnId, video, playerId) {
            const backBtn = document.getElementById(backBtnId);
            const forwardBtn = document.getElementById(forwardBtnId);
            
            if (!backBtn || !forwardBtn) return;
            
            // Track button hold state
            let holdTimeout = null;
            let isHolding = false;
            let originalSpeed = 1.0;
            
            /**
             * Start slow reverse playback when button is held
             */
            function startReversePlay() {
                isHolding = true;
                backBtn.classList.add('playing');
                originalSpeed = video.playbackRate;
                
                // HTML5 video doesn't support negative playback rate
                // So we simulate reverse by stepping backward in intervals
                video.pause();
                
                // Step backward continuously at ~30fps equivalent
                const reverseInterval = setInterval(() => {
                    if (!isHolding) {
                        clearInterval(reverseInterval);
                        return;
                    }
                    // Step back ~1/30th second per frame at 0.25x speed
                    const stepAmount = (1/30) * HOLD_PLAY_SPEED;
                    seekInstant(video, video.currentTime - stepAmount);
                }, 1000/30);
                
                // Store interval for cleanup
                backBtn.dataset.intervalId = reverseInterval;
            }
            
            /**
             * Start slow forward playback when button is held
             */
            function startForwardPlay() {
                isHolding = true;
                forwardBtn.classList.add('playing');
                originalSpeed = video.playbackRate;
                video.playbackRate = HOLD_PLAY_SPEED;
                video.play();
            }
            
            /**
             * Stop playback and restore original state
             */
            function stopPlay(btn) {
                const wasHolding = isHolding;
                isHolding = false;
                btn.classList.remove('playing');

                // Clear any pending hold timeout
                if (holdTimeout) {
                    clearTimeout(holdTimeout);
                    holdTimeout = null;
                }

                // Clear reverse playback interval if exists
                if (btn.dataset.intervalId) {
                    clearInterval(parseInt(btn.dataset.intervalId));
                    delete btn.dataset.intervalId;
                }

                video.pause();
                // Only a hold changed the speed - a quick tap must keep the user's speed
                if (wasHolding) video.playbackRate = originalSpeed;
            }
            
            /**
             * Handle single frame step backward
             */
            function stepBackward() {
                stepVideo(video, -1);
            }

            /**
             * Handle single frame step forward
             */
            function stepForward() {
                stepVideo(video, 1);
            }
            
            // ----- BACKWARD BUTTON EVENT HANDLERS -----
            
            // Mouse events for backward button
            backBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                // Start hold detection timer (150ms threshold)
                holdTimeout = setTimeout(() => startReversePlay(), 150);
            });
            
            backBtn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                if (!isHolding) {
                    // Was a quick tap - step single frame
                    clearTimeout(holdTimeout);
                    stepBackward();
                }
                stopPlay(backBtn);
            });
            
            backBtn.addEventListener('mouseleave', () => {
                if (isHolding) stopPlay(backBtn);
                clearTimeout(holdTimeout);
            });
            
            // Touch events for backward button
            backBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                holdTimeout = setTimeout(() => startReversePlay(), 150);
            }, { passive: false });
            
            backBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isHolding) {
                    clearTimeout(holdTimeout);
                    stepBackward();
                }
                stopPlay(backBtn);
            });
            
            backBtn.addEventListener('touchcancel', () => {
                stopPlay(backBtn);
                clearTimeout(holdTimeout);
            });
            
            // ----- FORWARD BUTTON EVENT HANDLERS -----
            
            // Mouse events for forward button
            forwardBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                holdTimeout = setTimeout(() => startForwardPlay(), 150);
            });
            
            forwardBtn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                if (!isHolding) {
                    clearTimeout(holdTimeout);
                    stepForward();
                }
                stopPlay(forwardBtn);
            });
            
            forwardBtn.addEventListener('mouseleave', () => {
                if (isHolding) stopPlay(forwardBtn);
                clearTimeout(holdTimeout);
            });
            
            // Touch events for forward button
            forwardBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                holdTimeout = setTimeout(() => startForwardPlay(), 150);
            }, { passive: false });
            
            forwardBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isHolding) {
                    clearTimeout(holdTimeout);
                    stepForward();
                }
                stopPlay(forwardBtn);
            });
            
            forwardBtn.addEventListener('touchcancel', () => {
                stopPlay(forwardBtn);
                clearTimeout(holdTimeout);
            });
        }
        
        // Initialize frame step buttons for both players
        setupFrameStepButtons('frameBackBtn1', 'frameForwardBtn1', v1, 1);
        setupFrameStepButtons('frameBackBtn2', 'frameForwardBtn2', v2, 2);

        // =================================================================
        // SYNC FRAME STEP BUTTONS (Dual Mode)
        // Control both videos simultaneously
        // =================================================================
        
        /**
         * Setup synchronized frame step buttons for dual mode
         * Steps both videos together, respecting sync lock offset
         */
        function setupSyncFrameStepButtons() {
            const backBtn = document.getElementById('syncFrameBackBtn');
            const forwardBtn = document.getElementById('syncFrameForwardBtn');
            
            if (!backBtn || !forwardBtn) return;
            
            let holdTimeout = null;
            let isHolding = false;
            let originalSpeed1 = 1.0;
            let originalSpeed2 = 1.0;
            
            /**
             * Start slow reverse playback for both videos
             */
            function startSyncReversePlay() {
                isHolding = true;
                backBtn.classList.add('playing');
                originalSpeed1 = v1.playbackRate;
                originalSpeed2 = v2.playbackRate;
                
                v1.pause();
                v2.pause();
                
                // Simulate reverse playback by stepping both videos backward
                const reverseInterval = setInterval(() => {
                    if (!isHolding) {
                        clearInterval(reverseInterval);
                        return;
                    }
                    const stepAmount = (1/30) * HOLD_PLAY_SPEED;
                    const targetTime = v1.currentTime - stepAmount;

                    if (isLocked) {
                        // Maintain sync offset (clamped at the video edges)
                        seekSynced(targetTime);
                    } else {
                        seekInstant(v1, targetTime);
                        seekInstant(v2, v2.currentTime - stepAmount);
                    }
                }, 1000/30);
                
                backBtn.dataset.intervalId = reverseInterval;
            }
            
            /**
             * Start slow forward playback for both videos
             */
            function startSyncForwardPlay() {
                isHolding = true;
                forwardBtn.classList.add('playing');
                originalSpeed1 = v1.playbackRate;
                originalSpeed2 = v2.playbackRate;
                
                v1.playbackRate = HOLD_PLAY_SPEED;
                v2.playbackRate = HOLD_PLAY_SPEED;
                v1.play();
                v2.play();
            }
            
            /**
             * Stop synchronized playback
             */
            function stopSyncPlay(btn) {
                const wasHolding = isHolding;
                isHolding = false;
                btn.classList.remove('playing');
                
                if (holdTimeout) {
                    clearTimeout(holdTimeout);
                    holdTimeout = null;
                }
                
                if (btn.dataset.intervalId) {
                    clearInterval(parseInt(btn.dataset.intervalId));
                    delete btn.dataset.intervalId;
                }
                
                v1.pause();
                v2.pause();
                // Only a hold changed the speed - a quick tap must keep the user's speed
                if (wasHolding) {
                    v1.playbackRate = originalSpeed1;
                    v2.playbackRate = originalSpeed2;
                }
